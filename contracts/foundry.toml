[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# FISCO BCOS 3.x EVM predates PUSH0; pin a pre-Shanghai target.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false
